[project]
name = "athena-executor"
version = "0.1.0"
description = "Athena privileged executor — the only component that may mutate protected systems"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "cryptography>=44.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
athena-executor = "athena_executor.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["athena_executor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
