[project]
name = "athena-core"
version = "0.1.0"
description = "Athena — autonomous security investigation, human-controlled remediation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
athena = "athena.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Migrations are append-only historical records; column DDL reads better on one line.
"athena/db/migrations/versions/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# B008: `Depends(...)` in a default IS the FastAPI idiom.
# S101: asserts are how tests assert.
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
