[project]
name = "athena-core"
version = "0.1.0"
description = "Athena — autonomous security investigation, human-controlled remediation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=44.0",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
# The two tools CI's verdict depends on are pinned exactly; mypy is not, because
# nothing runs it in CI. A floor lets an unchanged commit go red on a later run for
# a reason nobody introduced, which is not hypothetical here: ruff ships new rules
# under the `E`/`F`/`I`/`UP`/`B`/`S` selections below, and pytest 9.2.0 began
# applying `filterwarnings` to warnings raised during `pytest_configure`, which
# turned an unused plugin's deprecation notice into a collection-time crash three
# days after this suite last passed. Upgrading either is now a deliberate change:
# move the pin, fix what the new version finds, in the same commit. CI installs from
# here, so the version that judges a contributor is the one they ran.
#
# pytest-asyncio was the plugin in question and is not a dependency any more: there
# is no `async` anywhere in tests/, so it was loaded on every run, used by nothing.
# Anything that needs it should add it back along with the async tests that justify it.
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy>=1.13"]

[project.scripts]
athena = "athena.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Migrations are append-only historical records; column DDL reads better on one line.
"athena/db/migrations/versions/*" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# B008: `Depends(...)` in a default IS the FastAPI idiom.
# S101: asserts are how tests assert.
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
