name: athena

x-core: &core
  image: athena-core:${ATHENA_TAG:-dev}
  build:
    context: ../core
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &core-env
    ATHENA_DB_HOST: db
    ATHENA_DB_NAME: athena
    ATHENA_DB_USER: athena
    ATHENA_DB_PASSWORD_FILE: /run/secrets/db_password
    ATHENA_MASTER_KEY_FILE: /run/secrets/master_key
    ATHENA_NODE_SIGNING_KEY_FILE: /run/secrets/node_signing_key
    ATHENA_LOG_LEVEL: ${ATHENA_LOG_LEVEL:-INFO}
    ATHENA_AI_MODE: ${ATHENA_AI_MODE:-local_only}
    ATHENA_LLM_BASE_URL: ${ATHENA_LLM_BASE_URL:-http://127.0.0.1:1234}
    ATHENA_LLM_MODEL: ${ATHENA_LLM_MODEL:-}
    ATHENA_AI_BUDGET_CALLS: ${ATHENA_AI_BUDGET_CALLS:-500}
    ATHENA_INVESTIGATION_FLOOR: ${ATHENA_INVESTIGATION_FLOOR:-all}
    ATHENA_ENVIRONMENT: ${ATHENA_ENVIRONMENT:-production}
    ATHENA_COOKIE_SECURE: ${ATHENA_COOKIE_SECURE:-true}
  secrets: [db_password, master_key, node_signing_key]
  group_add:
    - "${ATHENA_SECRET_GID:-0}"
  networks: [private]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - athena-db:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *core
    restart: "no"
    healthcheck:
      disable: true
    command: ["migrate"]

  api:
    <<: *core
    command: ["serve"]
    networks: [private, nodechannel]
    ports:
      - "${ATHENA_API_BIND:-127.0.0.1}:${ATHENA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *core
    healthcheck:
      disable: true
    command: ["worker"]
    environment:
      <<: *core-env
      ATHENA_WORKER_CONCURRENCY: ${ATHENA_WORKER_CONCURRENCY:-4}
      ATHENA_WORK_VOLUME: athena-work
      ATHENA_SANDBOX_NETWORK: athena-nodechannel
      ATHENA_DOCKER_PROXY_HOST: tcp://docker-proxy:2375
      ATHENA_CODE_SCANS_ENABLED: ${ATHENA_CODE_SCANS_ENABLED:-true}
      ATHENA_GITLEAKS_IMAGE: ${ATHENA_GITLEAKS_IMAGE:-}
      ATHENA_TRIVY_IMAGE: ${ATHENA_TRIVY_IMAGE:-}
      ATHENA_SYFT_IMAGE: ${ATHENA_SYFT_IMAGE:-}
      ATHENA_GIT_IMAGE: ${ATHENA_GIT_IMAGE:-}
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
      - "${DOCKER_SOCKET_GID:-0}"
    networks: [private, egress]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - athena-work:/work
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *core
    healthcheck:
      disable: true
    command: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  executor:
    image: athena-executor:${ATHENA_TAG:-dev}
    build:
      context: ../executor
    restart: unless-stopped
    environment:
      ATHENA_DB_HOST: db
      ATHENA_DB_NAME: athena
      ATHENA_DB_USER: athena_executor
      ATHENA_DB_PASSWORD_FILE: /run/secrets/executor_db_password
      ATHENA_GRANT_PUBLIC_KEY_FILE: /run/secrets/grant_public_key
    secrets: [executor_db_password, grant_public_key]
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
    networks: [private]
    depends_on:
      migrate:
        condition: service_completed_successfully

  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VERSION: 1
      POST: 0
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      SERVICES: 0
      SESSION: 0
      TASKS: 0
      INFO: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ATHENA_DOCKER_PROXY_BIND:-127.0.0.1}:${ATHENA_DOCKER_PROXY_PORT:-2375}:2375"
    networks: [nodechannel]

  web:
    image: athena-web:${ATHENA_TAG:-dev}
    build:
      context: ../web
    restart: unless-stopped
    environment:
      NUXT_ATHENA_API_URL: http://api:8000
      NUXT_SESSION_SECRET_FILE: /run/secrets/session_secret
      NUXT_PUBLIC_APP_NAME: ${ATHENA_APP_NAME:-Athena}
      NUXT_APP_BASE_URL: ${ATHENA_BASE_PATH:-/}
      NUXT_DASHBOARD_ORIGIN: ${ATHENA_DASHBOARD_ORIGIN:-}
    secrets: [session_secret]
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
    ports:
      - "${ATHENA_WEB_BIND:-127.0.0.1}:${ATHENA_WEB_PORT:-8080}:3000"
    networks: [private, public]
    depends_on: [api]

volumes:
  athena-db:
  athena-work:
    name: athena-work

networks:
  private:
    internal: true
  nodechannel:
    name: athena-nodechannel
  egress: {}
  public: {}

secrets:
  db_password:          { file: ./secrets/db_password }
  executor_db_password: { file: ./secrets/executor_db_password }
  master_key:           { file: ./secrets/master_key }
  session_secret:       { file: ./secrets/session_secret }
  grant_public_key:     { file: ./secrets/grant_public_key }
  node_signing_key:     { file: ./secrets/node_signing_key }
