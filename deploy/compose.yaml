name: athena

x-core: &core
  image: athena-core:${ATHENA_TAG:-dev}
  build:
    context: ../core
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  environment: &core-env
    ATHENA_DB_HOST: db
    ATHENA_DB_NAME: athena
    ATHENA_DB_USER: athena
    ATHENA_DB_PASSWORD_FILE: /run/secrets/db_password
    ATHENA_MASTER_KEY_FILE: /run/secrets/master_key
    ATHENA_NODE_SIGNING_KEY_FILE: /run/secrets/node_signing_key
    ATHENA_LOG_LEVEL: ${ATHENA_LOG_LEVEL:-INFO}
    # local_only refuses any endpoint not demonstrably inside your network, so a
    # misconfiguration cannot quietly start shipping inventory to a hosted provider.
    ATHENA_AI_MODE: ${ATHENA_AI_MODE:-local_only}
    ATHENA_LLM_BASE_URL: ${ATHENA_LLM_BASE_URL:-http://127.0.0.1:1234}
    ATHENA_LLM_MODEL: ${ATHENA_LLM_MODEL:-qwen/qwen3.6-35b-a3b}
    ATHENA_ENVIRONMENT: ${ATHENA_ENVIRONMENT:-production}
    ATHENA_COOKIE_SECURE: ${ATHENA_COOKIE_SECURE:-true}
  secrets: [db_password, master_key, node_signing_key]
  # Compose bind-mounts file secrets with their host ownership, so the container user
  # must share a group with them. See deploy/scripts/gen-secrets.sh.
  group_add:
    - "${ATHENA_SECRET_GID:-0}"
  networks: [private]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: athena
      POSTGRES_USER: athena
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - athena-db:/var/lib/postgresql/data
    networks: [private]          # never published to the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *core
    restart: "no"
    healthcheck:
      disable: true
    command: ["migrate"]

  api:
    <<: *core
    command: ["serve"]
    # Published on loopback only, so a node agent running on this host can enrol and
    # poll. Not internet-facing: to enrol nodes on OTHER machines, expose core
    # deliberately — `tailscale serve` or a reverse proxy with TLS — rather than
    # widening this bind.
    #
    # A host port cannot be published from `private` alone: Docker does not run a
    # proxy for an internal network, so the binding is accepted and silently never
    # takes effect. Hence the dedicated non-internal `nodechannel` network.
    networks: [private, nodechannel]
    ports:
      - "${ATHENA_API_BIND:-127.0.0.1}:${ATHENA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *core
    healthcheck:
      disable: true   # no HTTP surface; a queue heartbeat check is M8 (reliability)
    command: ["worker"]
    environment:
      <<: *core-env
      ATHENA_WORKER_CONCURRENCY: ${ATHENA_WORKER_CONCURRENCY:-4}
      ATHENA_WORK_VOLUME: athena-work
      ATHENA_SANDBOX_NETWORK: athena-nodechannel
      ATHENA_DOCKER_PROXY_HOST: tcp://docker-proxy:2375
    # Group that owns the Docker socket. 0 on Docker Desktop, usually the `docker`
    # group's gid on a Linux host — `stat -c %g /var/run/docker.sock` to find it.
    # The worker still runs as an unprivileged user; only socket access is granted.
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
      - "${DOCKER_SOCKET_GID:-0}"
    # Vulnerability feeds are fetched from here, so the worker needs egress — the
    # `private` network is internal-only and cannot resolve DNS. In M3 this becomes
    # the path routed through the egress gateway, where the data-class policy and
    # the "what left my network?" log live.
    networks: [private, egress]
    volumes:
      # Launches sandboxed scanner containers as siblings. Socket access is
      # effectively root on the host: it is the residual risk recorded in
      # docs/TECHNICAL_DESIGN.md §23.1, and replacing it with a narrow socket proxy
      # is M8 hardening.
      - /var/run/docker.sock:/var/run/docker.sock
      # Shared with those containers by NAME — they cannot see a path that exists
      # only inside this container's filesystem.
      - athena-work:/work
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *core
    healthcheck:
      disable: true   # no HTTP surface; a queue heartbeat check is M8 (reliability)
    command: ["scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  executor:
    image: athena-executor:${ATHENA_TAG:-dev}
    build:
      context: ../executor
    restart: unless-stopped
    environment:
      ATHENA_DB_HOST: db
      ATHENA_DB_NAME: athena
      ATHENA_DB_USER: athena_executor
      ATHENA_DB_PASSWORD_FILE: /run/secrets/executor_db_password
      ATHENA_GRANT_PUBLIC_KEY_FILE: /run/secrets/grant_public_key
    secrets: [executor_db_password, grant_public_key]
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
    networks: [private]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Read-only view of the Docker API for the node agent.
  #
  # The agent needs to inventory images and containers, which are where most of a
  # modern estate's vulnerability surface lives. The obvious way — adding the agent
  # to the docker group — is root-equivalent on the host, and the agent is the one
  # component that takes input from the network.
  #
  # This moves socket access to a component that has no network surface of its own
  # and permits only GET on containers and images. Even a full compromise of the
  # proxy cannot create a container, because POST is refused.
  #
  # Residual risk: any local user can read container metadata over loopback. That is
  # a great deal less than root, and it is the trade being made deliberately.
  docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    environment:
      # Everything not listed defaults to 0. POST is refused, so nothing can be
      # created, started, stopped, or deleted through this path.
      CONTAINERS: 1
      IMAGES: 1
      VERSION: 1
      POST: 0
      # Explicitly denied, since these are the paths that turn read access into
      # host compromise.
      EXEC: 0
      BUILD: 0
      COMMIT: 0
      VOLUMES: 0
      NETWORKS: 0
      SECRETS: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      SERVICES: 0
      SESSION: 0
      TASKS: 0
      INFO: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${ATHENA_DOCKER_PROXY_BIND:-127.0.0.1}:${ATHENA_DOCKER_PROXY_PORT:-2375}:2375"
    networks: [nodechannel]

  web:
    image: athena-web:${ATHENA_TAG:-dev}
    build:
      context: ../web
    restart: unless-stopped
    environment:
      NUXT_ATHENA_API_URL: http://api:8000
      NUXT_SESSION_SECRET_FILE: /run/secrets/session_secret
      NUXT_PUBLIC_APP_NAME: ${ATHENA_APP_NAME:-Athena}
    secrets: [session_secret]
    group_add:
      - "${ATHENA_SECRET_GID:-0}"
    ports:
      - "${ATHENA_WEB_BIND:-127.0.0.1}:${ATHENA_WEB_PORT:-8080}:3000"
    networks: [private, public]   # the only service on the public network
    depends_on: [api]

volumes:
  athena-db:
  athena-work:
    # Explicit name: the worker passes this to `docker run -v` for sibling
    # containers, so it must not depend on the compose project prefix. A
    # mismatch silently creates a second, root-owned volume instead.
    name: athena-work

networks:
  private:
    internal: true
  # Carries the loopback-published node channel and the read-only Docker proxy.
  # Separate from `public` so the node surface and the browser surface are not on the
  # same network by accident. Explicitly named: the worker passes it to `docker run`
  # for sibling sandbox containers, which cannot resolve a compose-prefixed name.
  nodechannel:
    name: athena-nodechannel
  # Outbound only: vulnerability feeds. Nothing is published on it.
  egress: {}
  public: {}

secrets:
  db_password:          { file: ./secrets/db_password }
  executor_db_password: { file: ./secrets/executor_db_password }
  master_key:           { file: ./secrets/master_key }
  session_secret:       { file: ./secrets/session_secret }
  grant_public_key:     { file: ./secrets/grant_public_key }
  node_signing_key:     { file: ./secrets/node_signing_key }
