name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: athena_test
          POSTGRES_USER: athena
          POSTGRES_PASSWORD: test-only-not-a-secret
        options: >-
          --health-cmd "pg_isready -U athena" --health-interval 5s
          --health-timeout 3s --health-retries 20
        ports: ["5432:5432"]

    defaults: { run: { working-directory: core } }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check athena tests && ruff format --check athena tests

      # These gates are security controls, not style. They run before anything else
      # that could mask a failure.
      - name: Privilege boundaries
        run: pytest tests/test_boundaries.py -v

      - name: Unit tests
        run: pytest tests/test_envelope.py -v

      - name: Integration tests
        env:
          ATHENA_TEST_DB_URL: postgresql+psycopg://athena:test-only-not-a-secret@localhost:5432/athena_test
        run: pytest -v

  executor:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: executor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Executor imports without the core package present
        run: python -c "import athena_executor.main; print('executor image is self-contained')"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund
      - run: npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck deploy/deploy.sh deploy/scripts/*.sh

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t athena-core:ci core
      - run: docker build -t athena-executor:ci executor
      - name: Executor image contains no model client
        run: |
          if docker run --rm --entrypoint sh athena-executor:ci -c \
              "pip list 2>/dev/null | grep -Eiq 'anthropic|openai|langchain|litellm'"; then
            echo "::error::executor image contains a model client library"; exit 1
          fi
          echo "executor image is clean"
